version: 2

models:
  - name: stg_ibm_daily
    description: "Staging model for daily market data (multi-symbol)"

    columns:
      - name: symbol
        description: "Stock ticker symbol"
        data_tests:
          - not_null

      - name: date
        description: "Trading date"
        data_tests:
          - not_null

      - name: close
        description: "Daily closing price"
        data_tests:
          - not_null

      - name: volume
        description: "Daily trading volume"
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - symbol
            - date

  - name: fct_ibm_daily
    description: "Fact model containing cleaned daily financial data (multi-symbol)"

    columns:
      - name: symbol
        description: "Stock ticker symbol"
        data_tests:
          - not_null

      - name: date
        description: "Trading date"
        data_tests:
          - not_null

      - name: close
        description: "Daily closing price"
        data_tests:
          - not_null

      - name: daily_return_pct
        description: "Daily percentage return. NULL for the first trading day of each symbol, since no previous close exists."

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - symbol
            - date